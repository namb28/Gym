    // Generador de sonido de aviso con Web Audio API
    const playBeep = (freq = 440, type = 'sine', duration = 0.15) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio no disponible", e);
      }
    };

        ]

    function App() {
      const [view, setView] = useState('home');
      const [selectedDay, setSelectedDay] = useState('lunes');
      const [cardioMachine, setCardioMachine] = useState('Caminadora');

      const [weightHistory, setWeightHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('gym_weights') || '{}'); } catch(e) { return {}; }
      });
      const [bodyMetrics, setBodyMetrics] = useState(() => {
        try { return JSON.parse(localStorage.getItem('gym_body_metrics') || '[]'); } catch(e) { return []; }
      });

      const updateExerciseWeight = (exerciseName, weight) => {
        const updated = {
          ...weightHistory,
          [exerciseName]: {
            lastWeight: weight,
            history: [...(weightHistory[exerciseName]?.history || []), { weight, date: new Date().toLocaleDateString() }]
          }
        };
        setWeightHistory(updated);
        try { localStorage.setItem('gym_weights', JSON.stringify(updated)); } catch(e){}
      };

      const addBodyMetric = (metric) => {
        const updated = [{ ...metric, id: Date.now(), date: new Date().toLocaleDateString() }, ...bodyMetrics];
        setBodyMetrics(updated);
        try { localStorage.setItem('gym_body_metrics', JSON.stringify(updated)); } catch(e){}
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4">
          {view === 'home' && (
            <HomeView 
              selectedDay={selectedDay} 
              setSelectedDay={setSelectedDay}
              cardioMachine={cardioMachine}
              setCardioMachine={setCardioMachine}
              onStartWorkout={() => setView('workout')}
              onGoMetrics={() => setView('metrics')}
            />
          )}

          {view === 'workout' && (
            <WorkoutView 
              routine={ROUTINES[selectedDay]} 
              cardioMachine={cardioMachine}
              weightHistory={weightHistory}
              onSaveWeight={updateExerciseWeight}
              onFinish={() => setView('home')}
            />
          )}

          {view === 'metrics' && (
            <MetricsView 
              metrics={bodyMetrics} 
              onAddMetric={addBodyMetric} 
              onBack={() => setView('home')} 
            />
          )}
        </div>
      );
    }

    function HomeView({ selectedDay, setSelectedDay, cardioMachine, setCardioMachine, onStartWorkout, onGoMetrics }) {
      const days = [
        { key: 'lunes', label: 'Lunes', desc: 'Full body' },
        { key: 'martes', label: 'Martes', desc: 'Piernas' },
        { key: 'miercoles', label: 'Miércoles', desc: 'Espalda + Hombros + Tríceps' },
        { key: 'jueves', label: 'Jueves', desc: 'Glúteos' },
        { key: 'viernes', label: 'Viernes', desc: 'Full body (Enf. Inferior)' }
      ];

      const machines = ['Caminadora', 'Bicicleta elíptica', 'Bicicleta estática'];

      return (
        <div className="flex flex-col space-y-6 pt-2">
          <div>
            <h1 className="text-2xl font-black text-white tracking-tight">MI ENTRENAMIENTO</h1>
            <p className="text-slate-400 text-xs">Sesión de 5 min calentamiento + 10 bloques</p>
          </div>

          <div className="space-y-2">
            <span className="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Día</span>
            <div className="grid grid-cols-1 gap-2">
              {days.map(d => (
                <button
                  key={d.key}
                  onClick={() => setSelectedDay(d.key)}
                  className={`p-3 rounded-xl border text-left flex justify-between items-center transition ${
                    selectedDay === d.key 
                      ? 'bg-blue-600/20 border-blue-500 text-blue-200' 
                      : 'bg-slate-900 border-slate-800 text-slate-300'
                  }`}
                >
                  <div>
                    <div className="font-bold text-sm">{d.label}</div>
                    <div className="text-[11px] opacity-70">{d.desc}</div>
                  </div>
                  {selectedDay === d.key && <span className="text-blue-400 font-bold">✓</span>}
                </button>
              ))}
            </div>
          </div>

          <div className="space-y-2">
            <span className="text-[11px] uppercase font-bold text-slate-400 tracking-wider">Máquina de Cardio</span>
            <div className="grid grid-cols-3 gap-2">
              {machines.map(m => (
                <button
                  key={m}
                  onClick={() => setCardioMachine(m)}
                  className={`p-2.5 rounded-xl border text-[11px] font-semibold text-center transition ${
                    cardioMachine === m 
                      ? 'bg-emerald-600/20 border-emerald-500 text-emerald-300' 
                      : 'bg-slate-900 border-slate-800 text-slate-400'
                  }`}
                >
                  {m.replace('Bicicleta ', 'Bici ')}
                </button>
              ))}
            </div>
          </div>

          <div className="space-y-2 pt-2">
            <button
              onClick={onStartWorkout}
              className="w-full h-14 bg-blue-600 active:scale-95 rounded-2xl font-black text-base uppercase tracking-wider text-white shadow-lg shadow-blue-900/40 transition"
            >
              Comenzar Entrenamiento
            </button>
            <button
              onClick={onGoMetrics}
              className="w-full h-11 bg-slate-900 border border-slate-800 rounded-xl text-slate-300 font-semibold text-xs active:bg-slate-800 transition"
            >
              Ver / Registrar Medidas
            </button>

    function WorkoutView({ routine, cardioMachine, weightHistory, onSaveWeight, onFinish }) {
      // isWarmup inicia en true para los 5 min iniciales
      const [isWarmup, setIsWarmup] = useState(true);
      const [warmupIdx, setWarmupIdx] = useState(0); // 0 a 4 (5 minutos de calentamiento)

      const [blockIdx, setBlockIdx] = useState(0);
      const [subPhase, setSubPhase] = useState(0); // 0 a 3 (4 minutos de fuerza)
      const [isRest, setIsRest] = useState(false);
      const [timeLeft, setTimeLeft] = useState(60);
      const [running, setRunning] = useState(false);
      const [totalSecs, setTotalSecs] = useState(0);
      const [currentWeightInput, setCurrentWeightInput] = useState('');

      const currentBlock = routine.blocks[blockIdx];

      // Siguiente paso del cronómetro
      const nextStep = () => {
        // Manejo de Calentamiento Inicial (5 ejercicios de 1 min)
        if (isWarmup) {
          if (warmupIdx < 4) {
            setWarmupIdx(w => w + 1);
            setTimeLeft(60);
          } else {
            // Termina calentamiento -> Transición de 1 min antes de Bloque 1
            setIsWarmup(false);
            setIsRest(true);
            setTimeLeft(60);
          }
          return;
        }

        // Si estábamos descansando
        if (isRest) {
          setIsRest(false);
          setSubPhase(0);
          const nextB = routine.blocks[blockIdx];
          setTimeLeft(nextB.type === 'cardio' ? 240 : 60);
          return;
        }

        // Si estábamos en Cardio (4 min)
        if (currentBlock.type === 'cardio') {
          if (blockIdx + 1 < routine.blocks.length) {
            setBlockIdx(b => b + 1);
            setIsRest(true);
            setTimeLeft(60);
          } else {
            alert('¡Entrenamiento completado!');
            onFinish();
          }
          return;
        }

        // Si estábamos en Fuerza (4 min: A -> B -> A -> B)
        if (currentBlock.type === 'fuerza') {
          if (subPhase < 3) {
            setSubPhase(s => s + 1);
            setTimeLeft(60);
          } else {
            if (blockIdx + 1 < routine.blocks.length) {
              setBlockIdx(b => b + 1);
              setIsRest(true);
              setTimeLeft(60);
            } else {
              alert('¡Entrenamiento completado!');
              onFinish();
            }
          }
        }
      };

      // Loop de conteo regresivo y sonidos
      useEffect(() => {
        let t = null;
        if (running) {
          t = setInterval(() => {
            setTotalSecs(s => s + 1);
            setTimeLeft(prev => {
              // Beeps de aviso a los 3, 2 y 1 seg
              if (prev <= 4 && prev > 1) {
                playBeep(440, 'sine', 0.1);
              }
              // Beep final más agudo y largo
              if (prev === 1) {
                playBeep(880, 'triangle', 0.4);
                nextStep();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(t);
      }, [running, isWarmup, warmupIdx, isRest, blockIdx, subPhase]);

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      };

      // Título, icono y descripción actual
      let title = "";
      let iconType = "default";
      let subtitle = "";

      if (isWarmup) {
        title = WARMUP_EXERCISES[warmupIdx].name;
        iconType = WARMUP_EXERCISES[warmupIdx].icon;
        subtitle = WARMUP_EXERCISES[warmupIdx].cue;
      } else if (isRest) {
        title = "Descanso / Transición";
        iconType = "warmup";
        subtitle = "Respira y prepárate para el siguiente bloque";
      } else if (currentBlock.type === 'cardio') {
        title = `${cardioMachine} (Cardio)`;
        iconType = 'cardio';
        subtitle = "Mantén un ritmo constante durante los 4 minutos";
      } else {
        const isA = subPhase % 2 === 0;
        title = isA ? currentBlock.exA : currentBlock.exB;
        iconType = isA ? currentBlock.iconA : currentBlock.iconB;
        subtitle = `Serie ${Math.floor(subPhase / 2) + 1} de 2 (1 min)`;
      }

      const lastRecorded = weightHistory[title]?.lastWeight;

      return (
        <div className="flex flex-col min-h-[92vh] justify-between">
          {/* Header */}
          <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-xl">
            <button onClick={onFinish} className="text-xs text-red-400 font-bold uppercase">✕ Salir</button>
            <span className="font-mono text-xs text-slate-400">Total: {formatTime(totalSecs)}</span>
            <span className="text-xs font-bold text-blue-400">
              {isWarmup ? `Calentamiento ${warmupIdx + 1}/5` : `Bloque ${blockIdx + 1}/10`}
            </span>
          </div>

          {/* Área Central: Ejercicio, Ilustración y Temporizador */}
          <div className="text-center my-auto space-y-3 py-2 flex flex-col items-center">
            
            {/* Badge */}
            <span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${
              isWarmup ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/30' :
              isRest ? 'bg-amber-500/20 text-amber-300' :
              currentBlock.type === 'cardio' ? 'bg-emerald-500/20 text-emerald-300' :
              'bg-blue-500/20 text-blue-300'
            }`}>
              {isWarmup ? 'Movilidad y Activación' : isRest ? 'Transición' : currentBlock.type}
            </span>

            {/* Ilustración SVG del Ejercicio */}
            <div className="w-24 h-24 bg-slate-900 border border-slate-800 rounded-2xl p-2 flex items-center justify-center shadow-inner">
              <ExerciseIcon type={iconType} />
            </div>

            {/* Nombre y Guía Rápida */}
            <div className="min-h-[3rem] px-2">
              <h2 className="text-xl font-black text-white leading-tight">{title}</h2>
              <p className="text-slate-400 text-xs mt-1">{subtitle}</p>
            </div>

            {/* Cronómetro Gigante */}
            <div className="text-7xl font-mono font-black text-white tracking-tighter">
              {formatTime(timeLeft)}
            </div>

            {/* Registro de Carga (solo en bloques de fuerza) */}
            {!isWarmup && !isRest && currentBlock.type === 'fuerza' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 w-full max-w-xs text-left space-y-2">
                <div className="flex justify-between text-xs text-slate-400">
                  <span>Último peso:</span>
                  <span className="font-bold text-slate-200">{lastRecorded ? `${lastRecorded} kg` : 'Sin datos'}</span>
                </div>
                <div className="flex gap-2">
                  <input
                    type="number"
                    placeholder="Hoy (kg)"
                    value={currentWeightInput}
                    onChange={(e) => setCurrentWeightInput(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                  <button
                    onClick={() => {
                      if (currentWeightInput) {
                        onSaveWeight(title, currentWeightInput);
                        setCurrentWeightInput('');
                      }
                    }}
                    className="bg-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold text-white shrink-0"
                  >
                    Guardar
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Botones Grandes Inferiores */}
          <div className="grid grid-cols-3 gap-2">
            <button
              onClick={() => {
                if (isWarmup) setTimeLeft(60);
                else if (isRest) setTimeLeft(60);
                else if (currentBlock.type === 'cardio') setTimeLeft(240);
                else setTimeLeft(60);
              }}
              className="h-16 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col items-center justify-center text-slate-300 active:bg-slate-800"
            >
              <span className="text-base font-bold">↺</span>
              <span className="text-[10px] uppercase font-bold tracking-wider mt-1">Reiniciar</span>
            </button>

            <button
              onClick={() => setRunning(!running)}
              className={`h-16 rounded-2xl flex flex-col items-center justify-center font-black uppercase text-xs tracking-wider shadow-lg transition ${
                running ? 'bg-amber-600 text-white' : 'bg-emerald-600 text-white'
              }`}
            >
              <span className="text-lg">{running ? '❚❚' : '▶'}</span>
              <span className="text-[10px] mt-0.5">{running ? 'Pausa' : 'Iniciar'}</span>
            </button>

            <button
              onClick={nextStep}
              className="h-16 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col items-center justify-center text-slate-300 active:bg-slate-800"
            >
              <span className="text-base font-bold">⏭</span>
              <span className="text-[10px] uppercase font-bold tracking-wider mt-1">Saltar</span>
            </button>
          </div>
        </div>
      );
    }

    function MetricsView({ metrics, onAddMetric, onBack }) {
      const [form, setForm] = useState({ weight: '', cintura: '', cadera: '', brazo: '', muslo: '' });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.weight && !form.cintura) return;
        onAddMetric(form);
        setForm({ weight: '', cintura: '', cadera: '', brazo: '', muslo: '' });
      };

      return (
        <div className="space-y-4 pt-2">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold">Medidas Corporales</h2>
            <button onClick={onBack} className="text-xs text-blue-400 font-semibold">← Volver</button>
          </div>

          <form onSubmit={handleSubmit} className="bg-slate-900 p-4 border border-slate-800 rounded-xl space-y-3">
            <span className="text-xs font-bold text-slate-400 uppercase">Nuevo Registro</span>
            <div className="grid grid-cols-2 gap-2 text-xs">
              <input type="number" step="0.1" placeholder="Peso (kg)" value={form.weight} onChange={e => setForm({...form, weight: e.target.value})} className="bg-slate-950 p-2 border border-slate-700 rounded-lg text-white" />
              <input type="number" step="0.1" placeholder="Cintura (cm)" value={form.cintura} onChange={e => setForm({...form, cintura: e.target.value})} className="bg-slate-950 p-2 border border-slate-700 rounded-lg text-white" />
              <input type="number" step="0.1" placeholder="Cadera (cm)" value={form.cadera} onChange={e => setForm({...form, cadera: e.target.value})} className="bg-slate-950 p-2 border border-slate-700 rounded-lg text-white" />
              <input type="number" step="0.1" placeholder="Brazo (cm)" value={form.brazo} onChange={e => setForm({...form, brazo: e.target.value})} className="bg-slate-950 p-2 border border-slate-700 rounded-lg text-white" />
              <input type="number" step="0.1" placeholder="Muslo (cm)" value={form.muslo} onChange={e => setForm({...form, muslo: e.target.value})} className="bg-slate-950 p-2 border border-slate-700 rounded-lg text-white col-span-2" />
            </div>
            <button type="submit" className="w-full bg-emerald-600 text-white font-bold p-2.5 rounded-lg text-xs uppercase">
              Guardar Medidas
            </button>
          </form>

          <div className="space-y-2">
            <span className="text-xs font-bold text-slate-400 uppercase">Historial</span>
            <div className="space-y-2">
              {metrics.length === 0 ? (
                <div className="text-xs text-slate-500 text-center py-4">No hay medidas registradas</div>
              ) : (
                metrics.map(m => (
                  <div key={m.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl text-xs space-y-1">
                    <div className="text-slate-400 font-bold">{m.date}</div>
                    <div className="grid grid-cols-3 gap-1 text-slate-300">
                      {m.weight && <span>Peso: <b>{m.weight} kg</b></span>}
                      {m.cintura && <span>Cint: <b>{m.cintura} cm</b></span>}
                      {m.cadera && <span>Cad: <b>{m.cadera} cm</b></span>}
                      {m.brazo && <span>Brazo: <b>{m.brazo} cm</b></span>}
                      {m.muslo && <span>Muslo: <b>{m.muslo} cm</b></span>}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
