    // Audio nativo sin dependencias
    function playBeep(freq = 440, type = 'sine', duration = 0.15) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio", e);
      }
    }

    // Estado Global de la App
    const state = {
      view: 'home',
      selectedDay: 'lunes',
      cardioMachine: 'Caminadora',
      isWarmup: true,
      warmupIdx: 0,
      blockIdx: 0,
      subPhase: 0,
      isRest: false,
      timeLeft: 60,
      running: false,
      totalSecs: 0,
      timerInterval: null,
      weightHistory: JSON.parse(localStorage.getItem('gym_weights') || '{}'),
      bodyMetrics: JSON.parse(localStorage.getItem('gym_body_metrics') || '[]')
    };

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function saveWeights(name, val) {
      if (!val) return;
      state.weightHistory[name] = {
        lastWeight: val,
        history: [...(state.weightHistory[name]?.history || []), { weight: val, date: new Date().toLocaleDateString() }]
      };
      localStorage.setItem('gym_weights', JSON.stringify(state.weightHistory));
      render();
    }

    function nextStep() {
      if (state.isWarmup) {
        if (state.warmupIdx < 4) {
          state.warmupIdx++;
          state.timeLeft = 60;
        } else {
          state.isWarmup = false;
          state.isRest = true;
          state.timeLeft = 60;
        }
        render();
        return;
      }

      const routine = ROUTINES[state.selectedDay];
      const curBlock = routine.blocks[state.blockIdx];

      if (state.isRest) {
        state.isRest = false;
        state.subPhase = 0;
        const nextB = routine.blocks[state.blockIdx];
        state.timeLeft = (nextB.type === 'cardio' ? 240 : 60);
        render();
        return;
      }

      if (curBlock.type === 'cardio') {
        if (state.blockIdx + 1 < routine.blocks.length) {
          state.blockIdx++;
          state.isRest = true;
          state.timeLeft = 60;
        } else {
          alert('¡Entrenamiento completado!');
          resetToHome();
        }
        render();
        return;
      }

      if (curBlock.type === 'fuerza') {
        if (state.subPhase < 3) {
          state.subPhase++;
          state.timeLeft = 60;
        } else {
          if (state.blockIdx + 1 < routine.blocks.length) {
            state.blockIdx++;
            state.isRest = true;
            state.timeLeft = 60;
          } else {
            alert('¡Entrenamiento completado!');
            resetToHome();
          }
        }
        render();
      }
    }

    function toggleTimer() {
      state.running = !state.running;
      if (state.running) {
        state.timerInterval = setInterval(() => {
          state.totalSecs++;
          if (state.timeLeft <= 4 && state.timeLeft > 1) {
            playBeep(440, 'sine', 0.1);
          }
          if (state.timeLeft === 1) {
            playBeep(880, 'triangle', 0.4);
            nextStep();
            return;
          }
          state.timeLeft--;
          updateTimerUI();
        }, 1000);
      } else {
        clearInterval(state.timerInterval);
      }
      render();
    }

    function resetCurrentPhase() {
      const routine = ROUTINES[state.selectedDay];
      const curBlock = routine.blocks[state.blockIdx];
      if (state.isWarmup || state.isRest) state.timeLeft = 60;
      else if (curBlock.type === 'cardio') state.timeLeft = 240;
      else state.timeLeft = 60;
      updateTimerUI();
    }

    function resetToHome() {
      clearInterval(state.timerInterval);
      state.running = false;
      state.view = 'home';
      state.isWarmup = true;
      state.warmupIdx = 0;
      state.blockIdx = 0;
      state.subPhase = 0;
      state.isRest = false;
      state.totalSecs = 0;
      state.timeLeft = 60;
      render();
    }

    function updateTimerUI() {
      const timerEl = document.getElementById('timer-display');
      const totalEl = document.getElementById('total-time-display');
      if (timerEl) timerEl.textContent = formatTime(state.timeLeft);
