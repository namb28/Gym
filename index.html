    const playBeep = (freq = 440, type = 'sine', duration = 0.15) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio no disponible", e);
      }
    };

    function App() {
      const [view, setView] = useState('home');
      const [selectedDay, setSelectedDay] = useState('lunes');
      const [cardioMachine, setCardioMachine] = useState('Caminadora');

      const [weightHistory, setWeightHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('gym_weights') || '{}'); } catch(e) { return {}; }
      });
      const [bodyMetrics, setBodyMetrics] = useState(() => {
        try { return JSON.parse(localStorage.getItem('gym_body_metrics') || '[]'); } catch(e) { return []; }
      });

      const updateExerciseWeight = (exerciseName, weight) => {
        const updated = {
          ...weightHistory,
          [exerciseName]: {
            lastWeight: weight,
            history: [...(weightHistory[exerciseName]?.history || []), { weight, date: new Date().toLocaleDateString() }]
          }
        };
        setWeightHistory(updated);
        try { localStorage.setItem('gym_weights', JSON.stringify(updated)); } catch(e){}
      };

      const addBodyMetric = (metric) => {
        const updated = [{ ...metric, id: Date.now(), date: new Date().toLocaleDateString() }, ...bodyMetrics];
        setBodyMetrics(updated);
        try { localStorage.setItem('gym_body_metrics', JSON.stringify(updated)); } catch(e){}
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4">
          {view === 'home' && (
            <HomeView 
              selectedDay={selectedDay} 
              setSelectedDay={setSelectedDay}
              cardioMachine={cardioMachine}
              setCardioMachine={setCardioMachine}
              onStartWorkout={() => setView('workout')}
              onGoMetrics={() => setView('metrics')}
            />
          )}

          {view === 'workout' && (
            <WorkoutView 
              routine={ROUTINES[selectedDay]} 
              cardioMachine={cardioMachine}
              weightHistory={weightHistory}
              onSaveWeight={updateExerciseWeight}
              onFinish={() => setView('home')}
            />
          )}

          {view === 'metrics' && (
            <MetricsView 
              metrics={bodyMetrics} 
              onAddMetric={addBodyMetric} 
              onBack={() => setView('home')} 
            />
          )}
        </div>
      );
    }
